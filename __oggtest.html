<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ogg decode test</title></head>
<body><pre id="log"></pre>
<script>
const log = m => { document.getElementById("log").textContent += m + "\n"; console.log("[ogg]", m); };
(async () => {
  const ctx = new AudioContext();
  try {
    const r = await fetch("./__oggtest/bgm/th06_01.ogg");
    const ab = await r.arrayBuffer();
    log("ogg baixado: " + ab.byteLength + " bytes");
    const buf = await ctx.decodeAudioData(ab);
    const ch = buf.numberOfChannels, sr = buf.sampleRate, dur = buf.duration;
    log("DECODIFICADO: canais=" + ch + " taxa=" + sr + " duracao=" + dur.toFixed(1) + "s");
    const d = buf.getChannelData(0);
    let peak = 0, sum = 0;
    const upto = Math.min(d.length, sr * 60);
    for (let i = 0; i < upto; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sum += d[i]*d[i]; }
    log("OGG decodificado: peak=" + peak.toFixed(4) + " rms=" + Math.sqrt(sum/upto).toFixed(4));
    log("WAV original    : peak=0.8214 rms=0.1125   (referencia do primeiro minuto)");
    document.body.setAttribute("data-ok", "1");
  } catch (e) {
    log("ERRO: " + e.message);
  }
})();
</script></body></html>
